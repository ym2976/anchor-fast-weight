[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "anchor-fast-weight"
version = "0.1.0"
description = "Anchored fast-weight memory for streaming target speaker extraction"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["torch>=2.1", "numpy>=1.24", "soundfile>=0.12"]

[project.scripts]
afw-train = "ttse.train:main"
afw-infer = "ttse.infer:main"
afw-frontier = "ttse.frontier:main"

[tool.setuptools.packages.find]
include = ["ttse*"]

[tool.setuptools.package-data]
ttse = ["frontier_configs.json"]
